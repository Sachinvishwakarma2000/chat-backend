version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: chat_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: chat_backend_db
    ports:
      - "3306:3306"
    volumes:
      - chat_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  chat_mysql_data:
